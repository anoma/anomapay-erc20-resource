[package]
authors.workspace = true
description = "Host-side proving API for the AnomaPay ERC20 transfer resource: emergency migration transaction builder and embedded guest ELF/ImageID."
edition.workspace = true
license.workspace = true
name = "emergency_migrating_transfer_library"
readme = "README.md"
repository.workspace = true
version.workspace = true

[dependencies]
anoma-rm-risc0 = { workspace = true, features = ["transaction", "prove"] }
anoma-rm-risc0-gadgets = { workspace = true }
emergency_migrating_transfer_witness = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true, features = [
  "arithmetic",
  "serde",
  "expose-field",
  "std",
  "ecdsa",
  "hash2curve",
] }
lazy_static = { workspace = true }
serde = { workspace = true, features = ["derive"] }
transfer_witness = { workspace = true }
