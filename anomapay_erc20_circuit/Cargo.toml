[package]
description = "RISC Zero guest program and integration tests for the AnomaPay ERC20 transfer resource logic."
edition = "2021"
name = "anomapay-erc20-circuit"
version = "2.0.0"

[workspace]

[dependencies]
anoma-rm-risc0 = { version = "2.0.0-rc.6", default-features = false }
anoma-rm-risc0-gadgets = "2.0.0-rc.6"
anomapay_erc20_library = { path = "../anomapay_erc20_library" }
anomapay_erc20_witness = { path = "../anomapay_erc20_witness" }
k256 = { version = "=0.13.3", features = [
  "arithmetic",
  "serde",
  "expose-field",
  "std",
  "ecdsa",
  "hash2curve",
], default-features = false }
risc0-zkvm = "3.0.3"

[dev-dependencies]
bincode = "1.3.3"
