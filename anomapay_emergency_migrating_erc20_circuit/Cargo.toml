[package]
description = "RISC Zero guest program and integration tests for the AnomaPay ERC20 transfer resource logic, with emergency migration support."
edition = "2021"
name = "anomapay-emergency-migrating-erc20-circuit"
version = "2.0.0"

[workspace]

[dependencies]
anoma-rm-risc0 = { default-features = false, git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.7.1", version = "2.0.0-rc.7.1" }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.7.1", version = "2.0.0-rc.7.1" }
anomapay_emergency_migrating_erc20_library = { path = "../anomapay_emergency_migrating_erc20_library" }
anomapay_emergency_migrating_erc20_witness = { path = "../anomapay_emergency_migrating_erc20_witness" }
anomapay_erc20_library = { path = "../anomapay_erc20_library" }
anomapay_erc20_witness = { path = "../anomapay_erc20_witness" }
k256 = { version = "=0.13.3", features = [
  "arithmetic",
  "serde",
  "expose-field",
  "std",
  "ecdsa",
  "hash2curve",
], default-features = false }
risc0-zkvm = "3.0.3"

[dev-dependencies]
bincode = "1.3.3"
