[package]
description = "RISC Zero guest program and integration tests for the AnomaPay ERC20 transfer resource logic."
edition = "2021"
name = "token-transfer"
version = "2.0.0"

[workspace]

[dependencies]
anoma-rm-risc0 = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.4", default-features = false }
anoma-rm-risc0-gadgets = { git = "https://github.com/anoma/arm-risc0", tag = "v2.0.0-rc.4" }
k256 = { version = "=0.13.3", features = [
  "arithmetic",
  "serde",
  "expose-field",
  "std",
  "ecdsa",
  "hash2curve",
], default-features = false }
risc0-zkvm = "3.0.3"
transfer_library = { path = "../transfer_library" }
transfer_witness = { path = "../transfer_witness" }

[dev-dependencies]
bincode = "1.3.3"
