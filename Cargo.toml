[workspace]
exclude = ["transfer_circuit"]
members = ["transfer_witness", "transfer_library"]
resolver = "3"

[workspace.package]
authors = ["Xuyang <xuyang@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-erc20-resource"
version = "3.0.0-rc.2.1"

[workspace.dependencies]
alloy-primitives = "1.0.23"
alloy-sol-types = "1.0.23"
anoma-rm-risc0 = { version = "2.0.0-rc.8.1", default-features = false }
anoma-rm-risc0-gadgets = "2.0.0-rc.8.1"
bincode = "1.3.3"
hex = "0.4"
k256 = { version = "0.13", default-features = false }
lazy_static = "1.5.0"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
transfer_library = { path = "transfer_library" }
transfer_witness = { path = "transfer_witness" }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
