[workspace]
exclude = [
  "anomapay_erc20_circuit",
  "anomapay_emergency_migrating_erc20_circuit",
]
members = [
  "anomapay_erc20_witness",
  "anomapay_emergency_migrating_erc20_witness",
  "anomapay_erc20_library",
  "anomapay_emergency_migrating_erc20_library",
]
resolver = "3"

[workspace.package]
authors = ["Xuyang <xuyang@heliax.dev>"]
edition = "2024"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/anoma/anomapay-erc20-resource"
version = "3.0.0-rc.3"

[workspace.dependencies]
alloy-primitives = "1.0.23"
alloy-sol-types = "1.0.23"
anoma-rm-risc0 = { version = "2.0.0-rc.7", default-features = false }
anoma-rm-risc0-gadgets = "2.0.0-rc.7"
anomapay_emergency_migrating_erc20_library = { path = "anomapay_emergency_migrating_erc20_library" }
anomapay_emergency_migrating_erc20_witness = { path = "anomapay_emergency_migrating_erc20_witness" }
anomapay_erc20_library = { path = "anomapay_erc20_library" }
anomapay_erc20_witness = { path = "anomapay_erc20_witness" }
bincode = "1.3.3"
hex = "0.4"
k256 = { version = "0.13", default-features = false }
lazy_static = "1.5.0"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3
